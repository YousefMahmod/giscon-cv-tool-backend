<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - {{staffName}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Using a cleaner font stack to match the professional look of image_01fac1.png */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.5;
            color: #333;
            background: #fff;
            height: 100vh;
        }

        .page {
            display: flex;
            height: 100%;
        }

        .sidebar {
            width: 320px;
            background: #2d3e50;
            color: #fff;
            padding: 60px 30px;
            flex-shrink: 0;
            height: 100%;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: start;
            margin-bottom: 20px;
        }

        .profile-placeholder {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            overflow: hidden;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 30px;
        }

        .profile-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-size: 28pt;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .job-title {
            font-size: 14pt;
            color: #ecf0f1;
            margin-bottom: 20px;
            font-weight: 400;
        }

        .contact-info-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: start;
            font-size: 10pt;
            color: #ecf0f1;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }


        .sidebar-section {
            margin-top: 45px;
            width: 100%;
        }

        .sidebar-section-title {
            font-size: 12pt;
            font-weight: bold;
            color: #fff;
            margin-bottom: 15px;
            padding-top: 8px;
            padding-bottom: 8px;    
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #253644;
            gap: 16px;
            width: 100%;
        }

        .sidebar-text {
            font-size: 9.5pt;
            line-height: 1.7;
            color: #ecf0f1;
            text-align: justify; /* Matches the clean block text in image_01fac1.png profile */
        }

        /* MAIN CONTENT STYLES */
        .main-content {
            flex: 1;
            padding: 60px 45px;
            background: #fff;
        }

        .section {
            margin-bottom: 35px;
            width: 100%;
        }

        .section-title {
            background-color: #ececec;
            font-size: 13pt;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 18px;
            padding-top: 8px;
            padding-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        /* Experience Styling */
        .project {
            margin-bottom: 25px;
        }

        .project-meta {
            font-size: 10pt;
            color: #495057;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .project-title {
            font-size: 12.5pt;
            font-weight: bold;
            color: #212529;
            margin-bottom: 2px;
        }

        .project-role {
            font-size: 11pt;
            font-style: italic;
            color: #6c757d;
            margin-bottom: 12px;
        }

        .project-dates-location {
            font-size: 8pt;
            color: #6c757d;
        }

        .project-responsibilities li {
            margin-bottom: 8px;
            margin-left: 20px;
            font-size: 10pt;
            line-height: 1.6;
            color: #333;
        }

        /* Skills list matches image_01fac1.png spacing */
        .skills-list {
            list-style: none;
            padding-top: 5px;
        }

        .skills-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 10px;
            font-size: 10pt;
        }

        .skills-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            color: #333;
        }

        @media print {
            .page { min-height: auto; }
            .sidebar { -webkit-print-color-adjust: exact; background-color: #2d3e50 !important; }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="profile-section">
                <!-- Center aligned profile picture -->
                
                <div class="name">{{staffName}}</div>
                <div class="job-title">{{jobTitle}}</div>

                <div class="profile-container">
                    <div class="profile-placeholder">{{profilePicture}}</div>
                </div>
                
                <div class="contact-info-container">
                    <div class="contact-item">{{emailIcon}} {{email}}</div>
                    <div class="contact-item">{{phoneIcon}} {{phone}}</div>
                </div>
            </div>

            <!-- Profile/Bio -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">
                    <span>👤</span>
                    <span>PROFILE</span>
                </div>
                <div class="sidebar-text">{{bio}}</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Work Experience Section -->
            <div class="section">
                <div class="section-title">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/>
                        </svg>
                    </span> 
                    <span>WORK EXPERIENCE</span>
                </div>
                {{projectsContent}}
            </div>

            <!-- Skills Section -->
            <div class="section">
                <div class="section-title">
                    <span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 6L9 17l-5-5"/>
                        </svg>
                    </span> 
                    <span>SKILLS</span>
                </div>
                <ul class="skills-list">
                    {{skillsList}}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
