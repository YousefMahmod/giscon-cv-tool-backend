<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - {{staffName}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 11pt;
            line-height: 1.5;
            color: #000;
            background: #fff;
        }

        .page {
            max-width: 850px;
            margin: 0 auto;
            background: #fff;
            padding: 50px 60px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .name {
            font-size: 36pt;
            font-weight: normal;
            color: #000;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .job-title {
            font-size: 14pt;
            font-style: italic;
            color: #000;
            margin-bottom: 12px;
        }

        .contact-info {
            font-size: 11pt;
            color: #000;
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
        }

        .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 11pt;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #000;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid #000;
        }

        .summary-text {
            text-align: justify;
            line-height: 1.6;
            color: #000;
            font-size: 10.5pt;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .project {
            margin-bottom: 22px;
        }

        .project-header {
            margin-bottom: 8px;
        }

        .project-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }

        .project-company-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .project-title {
            font-size: 11pt;
            font-weight: bold;
            color: #000;
        }

        .project-name {
            font-size: 11pt;
            font-style: italic;
            color: #000;
        }

        .project-dates {
            font-size: 10pt;
            color: #000;
            font-style: italic;
        }

        .project-company {
            font-size: 10.5pt;
            font-style: italic;
            color: #000;
        }

        .project-location {
            font-size: 10pt;
            color: #000;
            font-style: italic;
        }

        .project-responsibilities {
            margin-top: 8px;
            padding-left: 0;
        }

        .project-responsibilities li {
            margin-bottom: 4px;
            margin-left: 20px;
            font-size: 10.5pt;
            line-height: 1.5;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 40px;
            margin-top: 10px;
        }

        .skills-grid li {
            margin-left: 20px;
            font-size: 10.5pt;
            line-height: 1.6;
        }

        .empty-projects {
            text-align: center;
            padding: 30px;
            color: #999;
            font-style: italic;
        }

        @media print {
            body {
                margin: 0;
                padding: 0;
                background: white;
            }
            .page {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <div class="header">
            <div class="name">{{staffName}}</div>
            <div class="job-title">{{jobTitle}}</div>
            <div class="contact-info">
                <div class="contact-item">
                    <span class="icon">{{emailIcon}}</span>
                    <span>{{email}}</span>
                </div>
                <div class="contact-item">
                    <span class="icon">{{phoneIcon}}</span>
                    <span>{{phone}}</span>
                </div>
            </div>
        </div>

        <!-- Summary/Bio Section -->
        <div class="section">
            <div class="section-title">Summary</div>
            <div class="summary-text">{{bio}}</div>
        </div>

        <!-- Projects/Professional Experience -->
        <div class="section">
            <div class="section-title">Professional Experience</div>
            {{projectsContent}}
        </div>

        <!-- Skills Section -->
        <div class="section">
            <div class="section-title">Skills</div>
            <ul class="skills-grid">
                {{skillsList}}
            </ul>
        </div>
    </div>
</body>
</html>
